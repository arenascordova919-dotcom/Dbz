name: Dragon Breakers Validate and Build

on:
  push:
    branches:
      - build/dragon-breakers-ui-v05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate JavaScript syntax
        run: |
          set -e
          for file in behavior_pack/scripts/*.js; do
            node --check "$file"
          done

      - name: Validate JSON, UUIDs, versions, and texture references
        run: |
          python - <<'PY'
          import json, pathlib, uuid, sys
          from PIL import Image

          roots = [pathlib.Path("behavior_pack"), pathlib.Path("resource_pack")]
          for root in roots:
              for path in root.rglob("*.json"):
                  try:
                      with path.open(encoding="utf-8") as f:
                          json.load(f)
                  except Exception as exc:
                      raise SystemExit(f"Invalid JSON: {path}: {exc}")

          # Decode every PNG so malformed/corrupt textures fail CI before mobile testing.
          for png_path in pathlib.Path("resource_pack").rglob("*.png"):
              try:
                  with Image.open(png_path) as image:
                      image.verify()
              except Exception as exc:
                  raise SystemExit(f"Malformed PNG: {png_path}: {exc}")

          # v0.6.4 must not contain the old fake race armor/item system at all.
          legacy_items = list(pathlib.Path("behavior_pack/items").glob("race_appearance_*.json"))
          if legacy_items:
              raise SystemExit(f"Legacy race appearance items still exist: {legacy_items}")
          legacy_attachables = list(pathlib.Path("resource_pack/attachables").glob("race_appearance_*.json"))
          if legacy_attachables:
              raise SystemExit(f"Legacy race armor attachables still exist: {legacy_attachables}")
          legacy_textures = list(pathlib.Path("resource_pack/textures/entity").glob("race_*.png"))
          if legacy_textures:
              raise SystemExit(f"Legacy race body textures still exist: {legacy_textures}")

          # Menu and technique launcher must render with empty geometry in-hand while retaining inventory icons.
          for hidden_item in ["menu.json", "technique_launcher.json"]:
              attachable_path = pathlib.Path("resource_pack/attachables") / hidden_item
              if not attachable_path.exists():
                  raise SystemExit(f"Missing invisible in-hand attachable: {attachable_path}")
              attachable = json.load(open(attachable_path, encoding="utf-8"))
              geometry = attachable.get("minecraft:attachable", {}).get("description", {}).get("geometry", {}).get("default")
              if geometry != "geometry.dbz.empty":
                  raise SystemExit(f"System item is not using empty held geometry: {attachable_path}")

          bp = json.load(open("behavior_pack/manifest.json", encoding="utf-8"))
          rp = json.load(open("resource_pack/manifest.json", encoding="utf-8"))

          if bp["header"]["version"] != rp["header"]["version"]:
              raise SystemExit("BP/RP version mismatch")
          if bp["header"]["version"] != [0, 6, 4]:
              raise SystemExit(f"Unexpected build version: {bp['header']['version']}")

          for manifest in (bp, rp):
              uuid.UUID(manifest["header"]["uuid"])
              for module in manifest.get("modules", []):
                  uuid.UUID(module["uuid"])
              for dependency in manifest.get("dependencies", []):
                  if "uuid" in dependency:
                      uuid.UUID(dependency["uuid"])

          if not any(d.get("uuid") == rp["header"]["uuid"] for d in bp.get("dependencies", [])):
              raise SystemExit("BP does not depend on RP")
          if not any(d.get("uuid") == bp["header"]["uuid"] for d in rp.get("dependencies", [])):
              raise SystemExit("RP does not depend on BP")

          atlas = json.load(open("resource_pack/textures/item_texture.json", encoding="utf-8"))
          for key, entry in atlas.get("texture_data", {}).items():
              texture = entry.get("textures")
              if not texture:
                  raise SystemExit(f"Missing texture path for atlas key {key}")
              path = pathlib.Path("resource_pack") / (texture + ".png")
              if not path.exists():
                  raise SystemExit(f"Atlas key {key} references missing file: {path}")

          # Validate custom attachable texture paths.
          for attachable_path in pathlib.Path("resource_pack/attachables").glob("*.json"):
              data = json.load(open(attachable_path, encoding="utf-8"))
              desc = data.get("minecraft:attachable", {}).get("description", {})
              for name, texture in desc.get("textures", {}).items():
                  if texture.startswith("textures/entity/"):
                      candidate = pathlib.Path("resource_pack") / (texture + ".png")
                      if not candidate.exists():
                          raise SystemExit(f"Attachable {attachable_path} references missing texture: {candidate}")

          # Render-controller aliases required by Mojang armor/item_default controllers.
          for attachable_path in pathlib.Path("resource_pack/attachables").glob("*.json"):
              data = json.load(open(attachable_path, encoding="utf-8"))
              desc = data.get("minecraft:attachable", {}).get("description", {})
              controllers = desc.get("render_controllers", [])
              if "controller.render.armor" in controllers or "controller.render.item_default" in controllers:
                  materials = desc.get("materials", {})
                  textures = desc.get("textures", {})
                  if "enchanted" not in materials or "enchanted" not in textures:
                      raise SystemExit(f"Missing enchanted material/texture aliases in {attachable_path}")

          # Particle textures must exist and decode.
          for particle_path in pathlib.Path("resource_pack/particles").glob("*.json"):
              data = json.load(open(particle_path, encoding="utf-8"))
              texture = data.get("particle_effect", {}).get("description", {}).get("basic_render_parameters", {}).get("texture")
              if texture and texture.startswith("textures/"):
                  candidate = pathlib.Path("resource_pack") / (texture + ".png")
                  if not candidate.exists():
                      raise SystemExit(f"Particle {particle_path} references missing texture: {candidate}")

          # Reject the old full-body race armor geometry that caused broken character visuals.
          for attachable_path in pathlib.Path("resource_pack/attachables").glob("race_appearance_*.json"):
              data = json.load(open(attachable_path, encoding="utf-8"))
              geometry = data.get("minecraft:attachable", {}).get("description", {}).get("geometry", {}).get("default", "")
              if geometry == "geometry.player.armor1":
                  raise SystemExit(f"Old full-body race geometry still present in {attachable_path}")

          for old_aura in [
              "resource_pack/particles/aura_body.particle.json",
              "resource_pack/particles/aura_rise.particle.json",
              "resource_pack/particles/aura_burst.particle.json",
          ]:
              if pathlib.Path(old_aura).exists():
                  raise SystemExit(f"Old aura particle returned: {old_aura}")

          # Validate Dragon Breakers custom UI texture paths.
          for ui_path in pathlib.Path("resource_pack/ui").glob("*.json"):
              data = ui_path.read_text(encoding="utf-8")
              for marker in [
                  "textures/ui/dragon_breakers/db_button",
                  "textures/ui/dragon_breakers/db_button_hover",
                  "textures/ui/dragon_breakers/db_button_pressed",
                  "textures/ui/dragon_breakers/db_panel",
                  "textures/ui/dragon_breakers/db_hud_panel",
                  "textures/ui/dragon_breakers/db_slot_panel",
              ]:
                  if marker in data:
                      candidate = pathlib.Path("resource_pack") / (marker + ".png")
                      if not candidate.exists():
                          raise SystemExit(f"UI {ui_path} references missing texture: {candidate}")

          # Required v0.6.4 system assets.
          required = [
              "behavior_pack/items/technique_launcher.json",
              "behavior_pack/scripts/appearance.js",
              "behavior_pack/scripts/charging.js",
              "behavior_pack/scripts/progression.js",
              "resource_pack/attachables/technique_launcher.json",
              "resource_pack/attachables/menu.json",
              "resource_pack/models/entity/empty.geo.json",
              "resource_pack/textures/items/technique_launcher.png",
              "resource_pack/textures/entity/transparent.png",
              "resource_pack/textures/particle/aura_flame.png",
              "resource_pack/textures/particle/kamehameha_beam.png",
              "resource_pack/particles/aura_blue_flame.particle.json",
              "resource_pack/particles/aura_gold_flame.particle.json",
              "resource_pack/particles/aura_violet_flame.particle.json",
              "resource_pack/particles/aura_green_flame.particle.json",
              "resource_pack/particles/aura_blue_spark.particle.json",
              "resource_pack/particles/aura_gold_spark.particle.json",
              "resource_pack/particles/aura_violet_spark.particle.json",
              "resource_pack/particles/aura_green_spark.particle.json",
              "resource_pack/particles/spirit_bomb_orb.particle.json",
              "resource_pack/particles/spirit_bomb_impact.particle.json",
          ]
          for required_path in required:
              if not pathlib.Path(required_path).exists():
                  raise SystemExit(f"Missing v0.6.4 required file: {required_path}")

          menu_js = pathlib.Path("behavior_pack/scripts/menu.js").read_text(encoding="utf-8")
          if '.button("§fCharacter"' in menu_js or "characterMenu(" in menu_js:
              raise SystemExit("Character menu entry/function returned in v0.6.4")
          if "ensureRaceCustomization" not in menu_js:
              raise SystemExit("Race customization flow missing")

          ui_defs = json.load(open("resource_pack/ui/_ui_defs.json", encoding="utf-8"))
          for entry in ui_defs.get("ui_defs", []):
              path = pathlib.Path("resource_pack") / entry
              if not path.exists():
                  raise SystemExit(f"_ui_defs references missing file: {path}")

          banned = ("heart_rend", "hunger_rend")
          for path in pathlib.Path("resource_pack/ui").rglob("*.json"):
              text = path.read_text(encoding="utf-8")
              for token in banned:
                  if token in text:
                      raise SystemExit(f"Old invalid HUD token {token} found in {path}")

          print("Dragon Breakers validation passed")
          PY

      - name: Build mcaddon
        run: |
          python - <<'PY'
          import pathlib, zipfile
          output = pathlib.Path("Dragon_Breakers_v0.6.4_TEST.mcaddon")
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as z:
              for pack in ("behavior_pack", "resource_pack"):
                  for path in pathlib.Path(pack).rglob("*"):
                      if path.is_file():
                          z.write(path, path.as_posix())
          with zipfile.ZipFile(output) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt zip member: {bad}")
              names = set(z.namelist())
              if "behavior_pack/manifest.json" not in names or "resource_pack/manifest.json" not in names:
                  raise SystemExit("Missing pack manifests from mcaddon")
          print(output)
          PY

      - name: Upload mcaddon artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dragon_Breakers_v0.6.4_TEST
          path: Dragon_Breakers_v0.6.4_TEST.mcaddon
          if-no-files-found: error
          retention-days: 7
