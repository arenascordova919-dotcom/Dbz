name: Dragon Breakers v0.7.3 Stability Build

on:
  push:
    branches:
      - build/v0.7.3-stability-controls
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate JavaScript
        run: |
          set -e
          for file in behavior_pack/scripts/*.js; do
            node --check "$file"
          done

      - name: Validate v0.7.3 stability
        run: |
          python - <<'PY'
          import json, pathlib, uuid
          from PIL import Image

          BP=pathlib.Path("behavior_pack")
          RP=pathlib.Path("resource_pack")

          for root in (BP,RP):
              for path in root.rglob("*.json"):
                  json.loads(path.read_text(encoding="utf-8"))

          for path in RP.rglob("*.png"):
              with Image.open(path) as image:
                  image.verify()

          bp=json.load(open(BP/"manifest.json",encoding="utf-8"))
          rp=json.load(open(RP/"manifest.json",encoding="utf-8"))
          expected=[0,7,3]
          if bp["header"]["version"] != expected or rp["header"]["version"] != expected:
              raise SystemExit(f"Expected v0.7.3, got BP={bp['header']['version']} RP={rp['header']['version']}")
          if bp["header"]["version"] != rp["header"]["version"]:
              raise SystemExit("BP/RP mismatch")

          for manifest in (bp,rp):
              uuid.UUID(manifest["header"]["uuid"])
              for module in manifest.get("modules",[]):
                  uuid.UUID(module["uuid"])
              for dep in manifest.get("dependencies",[]):
                  if "uuid" in dep: uuid.UUID(dep["uuid"])

          # Stability rule: never replace minecraft:player until the renderer is
          # proven safe in UI/skin contexts. This removes the actor-less Molang crash.
          if (BP/"entities/player.json").exists():
              raise SystemExit("Unsafe BP minecraft:player override returned")
          if (RP/"entity/player.entity.json").exists():
              raise SystemExit("Unsafe RP minecraft:player override returned")

          main=(BP/"scripts/main.js").read_text(encoding="utf-8")
          if "playerRenderer.js" in main or "startPlayerRendererSync" in main or "syncPlayerRenderer" in main:
              raise SystemExit("Player renderer sync is still active")
          for token in [
              "startSystemControlPolling",
              'selected === "dbz:menu"',
              'selected === "dbz:technique_launcher"',
              "player.isJumping",
              "player.isSneaking"
          ]:
              if token not in main:
                  raise SystemExit("Missing stable mobile control token: "+token)

          charging=(BP/"scripts/charging.js").read_text(encoding="utf-8")
          if "player.isSneaking" not in charging or "dbz:technique_launcher" not in charging:
              raise SystemExit("Charging control path missing")

          # Creator screens must not instantiate a player renderer.
          for ui in ("race_creator_form.json","appearance_creator_form.json"):
              text=(RP/"ui"/ui).read_text(encoding="utf-8")
              if "live_player_renderer" in text:
                  raise SystemExit("Unsafe live player renderer returned: "+ui)

          # No actor-property queries may exist in active resource JSON.
          for path in RP.rglob("*.json"):
              text=path.read_text(encoding="utf-8")
              if "query.property(" in text or "q.property(" in text:
                  raise SystemExit(f"Actor-dependent property query remains in {path}")

          # Mobile particle compatibility.
          for particle_name in ("kamehameha_beam.particle.json","ki_blast_trail.particle.json"):
              pdata=json.load(open(RP/"particles"/particle_name,encoding="utf-8"))
              bb=pdata["particle_effect"]["components"]["minecraft:particle_appearance_billboard"]
              if "direction" in bb:
                  raise SystemExit("Unsupported direction subsection returned: "+particle_name)
              if bb.get("facing_camera_mode") != "lookat_xyz":
                  raise SystemExit("Expected lookat_xyz: "+particle_name)

          # Hidden hand geometry remains intact.
          for hidden in ("menu.json","technique_launcher.json"):
              path=RP/"attachables"/hidden
              data=json.load(open(path,encoding="utf-8"))
              if data["minecraft:attachable"]["description"]["geometry"]["default"] != "geometry.dbz.empty":
                  raise SystemExit("System item became visible in hand: "+hidden)

          print("Dragon Breakers v0.7.3 stability validation passed")
          PY

      - name: Build mcaddon
        run: |
          python - <<'PY'
          import pathlib, zipfile
          out=pathlib.Path("Dragon_Breakers_v0.7.3_STABILITY_CONTROLS_FIX.mcaddon")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for pack in ("behavior_pack","resource_pack"):
                  for path in pathlib.Path(pack).rglob("*"):
                      if path.is_file():
                          z.write(path,path.as_posix())
          with zipfile.ZipFile(out) as z:
              bad=z.testzip()
              if bad:
                  raise SystemExit("Corrupt member: "+bad)
              names=set(z.namelist())
              if "behavior_pack/manifest.json" not in names or "resource_pack/manifest.json" not in names:
                  raise SystemExit("Missing pack manifests")
          print(out)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Dragon_Breakers_v0.7.3_STABILITY_CONTROLS_FIX
          path: Dragon_Breakers_v0.7.3_STABILITY_CONTROLS_FIX.mcaddon
          if-no-files-found: error
          retention-days: 7
