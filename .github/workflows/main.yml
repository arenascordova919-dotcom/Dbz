name: ChatGPT Code Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  chatgpt-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ChatGPT GitHub Actions
        uses: dlidstrom/genai-code-review@v3.0.8
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
